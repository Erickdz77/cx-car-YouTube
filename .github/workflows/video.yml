name: Gerar video de carros

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests edge-tts

      - name: Gerar video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      - name: Guardar video para download
        uses: actions/upload-artifact@v4
        with:
          name: video-pronto
          path: saida/

      - name: Salvar historico de temas
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add historico.json
          git commit -m "atualiza historico" || echo "sem mudancas"
          git push
